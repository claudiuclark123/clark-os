      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache \
                      /usr/local/share/boost /usr/share/swift /usr/local/.ghcup
          sudo docker image prune -af || true
          sudo apt-get clean
          df -h /

      - name: Configure ${{ matrix.edition }} edition
        run: |
          sed -i 's/^INCLUDE_GAMING=.*/INCLUDE_GAMING="${{ matrix.gaming }}"/; s/^INCLUDE_DEV=.*/INCLUDE_DEV="${{ matrix.dev }}"/' config/distro.conf
          grep -E '^INCLUDE_' config/distro.conf

      - name: Build ISO
        run: |
          chmod +x build.sh chroot-setup.sh
          sudo ./build.sh 2>&1 | tee build.log
          ISO=$(ls out/*.iso)
          sudo mv "$ISO" "${ISO%.iso}-${{ matrix.edition }}.iso"
          sudo chown -R "$USER" out
          ls -lh out

      - name: Show skipped apps
        if: always()
        run: grep WARN build.log || echo "No warnings"

      - name: Checksum and split (GitHub limits release files to 2 GB)
        run: |
          cd out
          ISO=$(ls *.iso)
          sha256sum "$ISO" > "$ISO.sha256"
          split -b 1900M -d "$ISO" "$ISO.part"
          rm "$ISO"
          ls -lh

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ matrix.edition }}
          path: build.log

      - name: Upload ISO parts (manual and scheduled runs)
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: actions/upload-artifact@v4
        with:
          name: iso-${{ matrix.edition }}
          path: out/*
          retention-days: 7
          compression-level: 0

      - name: Add to release (tag builds)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*
          body: |
            **Full** edition: everything, including gaming (Steam, Proton, Lutris, Heroic) and developer tools (VS Code, Docker).
            **Lite** edition: the same desktop and everyday apps, without gaming and developer tools.

            Download every `.part` file for your edition into one folder, then join them:
            - Linux/macOS: `cat clarkos-*-full.iso.part* > clarkos-full.iso && sha256sum -c clarkos-*-full.iso.sha256`
            - Windows (cmd): `copy /b clarkos-1.0-amd64-full.iso.part00+clarkos-1.0-amd64-full.iso.part01 clarkos-full.iso`
            (Replace `full` with `lite` for the Lite edition.)

