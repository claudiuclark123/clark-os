name: Build ISO

on:
  workflow_dispatch:
    inputs:
      editions:
        description: 'Which editions to build'
        type: choice
        options: [both, full, lite]
        default: both
  push:
    tags: ['v*']              # git tag v1.0 && git push --tags -> builds both + publishes a release
  schedule:
    - cron: '0 3 * * 1'       # weekly rebuild (Mondays 03:00 UTC) for security updates

permissions:
  contents: write

concurrency:
  group: iso-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - id: m
        run: |
          FULL='{"edition":"full","gaming":"yes","dev":"yes"}'
          LITE='{"edition":"lite","gaming":"no","dev":"no"}'
          case "${{ github.event.inputs.editions || 'both' }}" in
            full) echo "matrix=[$FULL]" >> "$GITHUB_OUTPUT" ;;
            lite) echo "matrix=[$LITE]" >> "$GITHUB_OUTPUT" ;;
            *)    echo "matrix=[$FULL,$LITE]" >> "$GITHUB_OUTPUT" ;;
          esac

  build:
    needs: setup
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    strategy:
      fail-fast: false        # one edition failing doesn't cancel the other
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    name: Build ${{ matrix.edition }}
    steps:
      - uses: actions/checkout@v4

      - name: Unpack Clark OS kit
        run: |
